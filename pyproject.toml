  "transformers>=4.44",
  "datasets>=2.20",
  "sentencepiece>=0.2.0",
  "gguf>=0.10.0",
  "numpy",
  "tqdm",
  "accelerate",
  "safetensors",
  "protobuf>=7.36.2",
]
